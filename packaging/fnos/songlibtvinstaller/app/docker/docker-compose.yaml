services:
  installer:
    image: songlib-tv-installer:0.1.0
    pull_policy: never
    env_file: /var/apps/songlibtvinstaller/var/runtime.env
    ports:
      - "5533:5533"
    volumes:
      - /var/apps/songlibtvinstaller/var/data:/data
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket:ro
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /run:size=16m,mode=1777
    ulimits:
      core: 0
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:5533/ready]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
