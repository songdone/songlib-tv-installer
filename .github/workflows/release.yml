name: "🚀 Release"

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate cross-platform builds
    permissions:
      contents: write
    strategy:
      matrix:
        go_version: [1.25.x]
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vars.outputs.VERSION }}
      BUILDDATE: ${{ steps.vars.outputs.BUILDDATE }}
      COMMIT: ${{ steps.vars.outputs.COMMIT }}
      APP_NAME: ${{ steps.vars.outputs.APP_NAME }}
      PUSH_DOCKERHUB: ${{ steps.vars.outputs.PUSH_DOCKERHUB }}
      CHANGELOG: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: metadata
        uses: ahmadnassri/action-metadata@v2
      - name: Initialize workflow environment variables
        id: vars
        run: |
          echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "BUILDDATE=$(date '+%F-%T')" >> "$GITHUB_OUTPUT"
          echo "COMMIT=$(git rev-parse --verify HEAD)" >> "$GITHUB_OUTPUT"
          # Dockerfile 与 entrypoint 都按 atvloadly 引用主程序名；仓库改名不能影响产物名
          echo "APP_NAME=atvloadly" >> "$GITHUB_OUTPUT"
          # ldflags -X 必须用 go.mod 的模块路径（github.com/bitxeno/atvloadly）
          echo "REPO=github.com/bitxeno/atvloadly" >> "$GITHUB_OUTPUT"
          echo "BRANCH=${{ steps.metadata.outputs.repository_default_branch }}" >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKER_TOKEN" ]; then echo "PUSH_DOCKERHUB=1" >> "$GITHUB_OUTPUT"; fi
        env:
          DOCKER_TOKEN: "${{ secrets.DOCKER_TOKEN }}"

      - name: Build and test frontend
        run: cd ./web/static && npm install && npm test && npm run build

      - name: Run Go tests
        run: go vet ./... && go test -count=1 ./...

      # Dockerfile 会把源码归档打进镜像 /opt/songlib-source.tar.gz，供 /source 路由履行 AGPL 义务
      - name: Generate source archive
        run: mkdir -p build && git archive --format=tar.gz -o build/songlib-source.tar.gz HEAD

      - name: Generate server binaries
        uses: crazy-max/ghaction-xgo@v4
        env:
          CGO_ENABLED: "0"
        with:
          xgo_version: latest
          go_version: ${{ matrix.go_version }}
          dest: build
          prefix: ${{ steps.vars.outputs.APP_NAME }}
          targets: linux/amd64,linux/arm64
          v: true
          x: false
          ldflags: -w -s -X ${{ steps.vars.outputs.REPO }}/internal/app/build.Version=${{ steps.vars.outputs.VERSION }} -X ${{ steps.vars.outputs.REPO }}/internal/app/build.BuildDate=${{ steps.vars.outputs.BUILDDATE }} -X ${{ steps.vars.outputs.REPO }}/internal/app/build.Commit=${{ steps.vars.outputs.COMMIT }} -X ${{ steps.vars.outputs.REPO }}/internal/app/build.Mode=production -X ${{ steps.vars.outputs.REPO }}/internal/app/build.WebUpdateFeed=${{ vars.SONGLIB_WEB_UPDATE_FEED }} -X ${{ steps.vars.outputs.REPO }}/internal/app/build.WebUpdateKeyID=${{ vars.SONGLIB_WEB_UPDATE_KEY_ID }} -X ${{ steps.vars.outputs.REPO }}/internal/app/build.WebUpdatePublicKey=${{ vars.SONGLIB_WEB_UPDATE_PUBLIC_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.APP_NAME }}
          path: build
          retention-days: 1

      - name: Generate Changelog
        id: changelog
        uses: bitxeno/changelogithub-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          types: |
            feat
            fix
            perf
            refactor
            chore

  dockerhub:
    name: Push to DockerHub
    if: ${{ needs.build.outputs.PUSH_DOCKERHUB }}
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.APP_NAME }}
          path: build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}
          tags: |
            type=ref,event=tag
            # 同时推不带 v 的版本号 tag（如 1.2.0）——FPK 的 compose 引用此格式
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
          flavor: |
            latest=false
      - name: Build and push Docker images to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ needs.build.outputs.APP_NAME }}
            VERSION=${{ needs.build.outputs.VERSION }}
            BUILDDATE=${{ needs.build.outputs.BUILDDATE }}
            COMMIT=${{ needs.build.outputs.COMMIT }}

  ghcr:
    name: Push to GitHub Container Registry
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.APP_NAME }}
          path: build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
          flavor: |
            latest=false
      - name: Build and push Docker images to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ needs.build.outputs.APP_NAME }}
            VERSION=${{ needs.build.outputs.VERSION }}
            BUILDDATE=${{ needs.build.outputs.BUILDDATE }}
            COMMIT=${{ needs.build.outputs.COMMIT }}

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.APP_NAME }}
          path: build

      - name: Compress server builds
        run: |
          cd ./build
          for i in *; do
            case "$i" in
              *.tar.gz) continue ;;
            esac
            tar -czf "$i.tar.gz" "$i"
          done
          cd ..

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./build/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: "SongLib TV Installer ${{ github.ref_name }}"
          body: ${{ needs.build.outputs.CHANGELOG }}
          draft: true
          fail_on_unmatched_files: true

  clean:
    name: Delete temp artifacts
    if: always() && (needs.dockerhub.result == 'success' || needs.dockerhub.result == 'skipped') && (needs.ghcr.result == 'success')
    needs: [build, dockerhub, ghcr, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            ${{ needs.build.outputs.APP_NAME }}
          failOnError: false
