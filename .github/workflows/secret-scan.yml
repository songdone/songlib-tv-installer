name: "🕵️ Secret scan"

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets in diffs and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks (this push / PR diff)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 全量历史兜底扫描：新贡献者第一次 PR 时也能看到历史里是否引入过密钥。
      - name: gitleaks (full history, report only)
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks:latest detect --source /repo \
            --redact -v --no-git=false --report-format sarif \
            --report-path /tmp/gitleaks-history.sarif || \
            echo "::warning::History scan found findings — review the SARIF artifact."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-history-sarif
          path: /tmp/gitleaks-history.sarif
          retention-days: 7
