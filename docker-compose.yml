version: '3.3'
services:
  songlib-tv-installer:
    container_name: songlib-tv-installer
    hostname: songlib-tv-installer
    image: 666uos/songlib-tv-installer:latest
    security_opt:
      - seccomp:unconfined
    volumes:
      - /etc/atvloadly:/data
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon 
    ports:
      - 5533:80/tcp
    ulimits:
      core: 0
    restart: unless-stopped
